<body>
    <form action="thanks.html" target="_blank">

Ваше ім'я: <input name="name" type="text" maxlength="40" size="40" value="Артем">

<select name="curs" size="1">

</select>

<input type="checkbox" name="comp_eng" value="yes"> Комп'ютерна інженерія
<input type="checkbox" name="networks" value="yes"> Комп'ютерні мережі

Напишіть декілька слів про себе:
        </pre>
        <textarea name="about" rows="6" cols="60" wrap="off">Я студент Полтавської політехніки, захоплююсь веб-розробкою та важкою атлетикою.</textarea>
        <p>
            <input type="submit" value="Відіслати дані">

            <input type="file" name="friend" size="50">
